name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24] # the maintained LTS lines
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-fund --no-audit --ignore-scripts # exactly the versions in package-lock.json; no dependency install scripts run
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test # builds, then runs the offline safety tests with coverage thresholds: nothing is paid or sent
      - run: npm run check:package # the published package resolves and types correctly (publint, attw)
